<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Loud Crayon OS Feedback</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      width: 360px;
      background-color: #0b0f19;
      color: #f1f5f9;
      padding: 16px;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 12px;
      margin-bottom: 12px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-badge {
      background: linear-gradient(135deg, #ea580c, #f59e0b);
      color: white;
      font-weight: 800;
      padding: 4px 7px;
      border-radius: 6px;
      font-size: 11px;
    }
    .brand-title {
      font-weight: 700;
      font-size: 14px;
      color: #ffffff;
      letter-spacing: -0.01em;
    }
    .subtext {
      font-size: 10px;
      color: #94a3b8;
    }
    .badge-tag {
      background-color: rgba(234, 88, 12, 0.15);
      color: #fb923c;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid rgba(234, 88, 12, 0.3);
      font-weight: 600;
    }
    .field {
      margin-bottom: 10px;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    input[type="text"], textarea, select {
      width: 100%;
      background-color: #111827;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="text"]:focus, textarea:focus, select:focus {
      border-color: #f97316;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .preview-box {
      border: 1px solid #334155;
      border-radius: 6px;
      overflow: hidden;
      background: #000;
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .preview-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
    }
    .btn {
      width: 100%;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      border: none;
      transition: background 0.15s, opacity 0.15s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #ea580c, #f59e0b);
      color: white;
      box-shadow: 0 4px 12px rgba(234, 88, 12, 0.3);
      margin-top: 6px;
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #c2410c, #d97706);
    }
    .status-msg {
      padding: 8px;
      border-radius: 6px;
      margin-bottom: 10px;
      font-size: 11px;
      display: none;
    }
    .status-success {
      background-color: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #34d399;
    }
    .status-error {
      background-color: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #f87171;
    }
    .disabled-state {
      padding: 24px 16px;
      text-align: center;
      background-color: #111827;
      border: 1px solid #334155;
      border-radius: 8px;
      margin-top: 10px;
    }
    .disabled-icon {
      font-size: 28px;
      margin-bottom: 8px;
    }
    .disabled-title {
      font-size: 14px;
      font-weight: 700;
      color: #f87171;
      margin-bottom: 6px;
    }
    .disabled-text {
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <div class="logo-badge">LC</div>
      <div>
        <div class="brand-title">Loud Crayon OS</div>
        <div class="subtext">Feedback & Bug Reporter</div>
      </div>
    </div>
    <div class="badge-tag">Sites Only v1.1</div>
  </div>

  <div id="statusBox" class="status-msg"></div>

  <div id="disabledContainer" class="disabled-state" style="display: none;">
    <div class="disabled-icon">🔒</div>
    <div class="disabled-title">Not a Loud Crayon website</div>
    <div class="disabled-text">
      The Loud Crayon feedback tool is strictly restricted to editing and feedback on authorized Loud Crayon websites and client registry domains.
    </div>
  </div>

  <form id="feedbackForm">
    <div class="field">
      <label for="title">Issue Summary *</label>
      <input type="text" id="title" required placeholder="e.g. Header overlap, typo on preview page...">
    </div>

    <div class="field">
      <label for="description">Notes / Expected Result</label>
      <textarea id="description" rows="2" placeholder="Describe the issue or what should be changed..."></textarea>
    </div>

    <div class="row">
      <div class="field">
        <label for="priority">Priority</label>
        <select id="priority">
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
        </select>
      </div>

      <div class="field">
        <label for="elementSelector">Target Element</label>
        <input type="text" id="elementSelector" placeholder="body or pick element">
      </div>
    </div>

    <div class="field">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
        <label style="margin-bottom: 0;">Screenshot</label>
        <button type="button" id="recaptureBtn" style="background: none; border: none; color: #fb923c; font-size: 10px; cursor: pointer; text-decoration: underline;">
          Re-capture Tab
        </button>
      </div>
      <div class="preview-box" id="previewBox">
        <span style="color: #64748b; font-size: 11px;" id="previewPlaceholder">Capturing visible tab...</span>
        <img id="screenshotPreview" style="display: none;" alt="Preview">
      </div>
    </div>

    <div class="field">
      <label for="osEndpoint">Loud Crayon OS Endpoint</label>
      <input type="text" id="osEndpoint" value="http://localhost:3000">
    </div>

    <button type="submit" id="submitBtn" class="btn btn-primary">
      Dispatch to Loud Crayon OS Inbox
    </button>
  </form>

  <script src="popup.js"></script>
</body>
</html>
